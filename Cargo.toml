[package]
name = "pgcat"
version = "1.3.0"
edition = "2021"
# The toolchain the Dockerfile and CI build with.
rust-version = "1.97.1"
# src/main.rs is upstream's startup loop, kept as a module of the library
# (src/lib.rs); the binary is src/bin/pgcat.rs. Tools that infer targets, such
# as cargo-chef in Dockerfile.dev, would otherwise see a second `pgcat` binary.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "pgcat"
path = "src/bin/pgcat.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
md-5 = "0.10"
bb8 = "=0.8.6"
async-trait = "0.1"
rand = "0.10"
chrono = "0.4"
sha1 = "0.10"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
regex = "1"
num_cpus = "1"
once_cell = "1"
sqlparser = { version = "0.64", features = ["visitor"] }
log = "0.4"
arc-swap = "1"
parking_lot = "0.12.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
stringprep = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
rustls-pemfile = "2"
http-body-util = "0.1.2"
hyper = { version = "1.4.1", features = ["full"] }
hyper-util = { version = "0.1.7", features = ["tokio"] }
phf = { version = "0.13", features = ["macros"] }
exitcode = "1.1.2"
futures = "0.3"
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.31", features = ["signal"] }
atomic_enum = "0.2.0"
postgres-protocol = "0.6.5"
fallible-iterator = "0.2"
pin-project = "1"
webpki-roots = "1"
# ring, as before; the provider is selected explicitly in code.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
hickory-resolver = "0.26.2"
tokio-test = "0.4.2"
serde_json = "1"
itertools = "0.10"
clap = { version = "4.3.1", features = ["derive", "env"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.20", features = [
    "json",
    "env-filter",
    "std",
] }
lru = "0.16"
mini-moka = "0.10.3"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = "0.5.0"

[dev-dependencies]
serial_test = "*"
# Paused clocks for timer tests; never a production feature.
tokio = { version = "1", features = ["full", "test-util"] }

[[example]]
name = "registered_plugin"
path = "tests/fixtures/registered_plugin.rs"
required-features = ["test-plugins"]

[[example]]
name = "configured_plugin"
path = "tests/fixtures/configured_plugin.rs"
required-features = ["test-plugins"]

[features]
# Compiles in `plugins::testing`, a plugin used by the integration tests to
# exercise the plugin hooks. Never enable it in production builds.
test-plugins = []
